groups:
  - name: sre-api-alerts
    rules:
      - alert: HighHTTP5xxErrorRate
        expr: |
          (
            sum(rate(http_request_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_request_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          sumary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors."
      - alert: HighHTTPP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP p95latency"
          description: "The HTTP p95 latency has exceeded 200 ms for 2 minutes."
