repos:
  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black
        args: [--line-length=79]

  - repo: local
    hooks:
      - id: check-commit-message
        name: Validate Conventional Commits (Mandatory Scope)
        stages: [commit-msg]
        language: python
        entry: |
          python3 -c '
          import sys, re
          with open(sys.argv[1], "r") as f:
              lines = [line.strip() for line in f.readlines() if line.strip() and not line.startswith("#")]

          msg = lines[0] if lines else ""
          pattern = r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)\([a-zA-Z0-9_\-]+\): .+"

          if not re.match(pattern, msg):
              print(f"\n[ERRO] Invalid message: \"{msg}\"")
              print("The commit must follow this format: type(scope): description.")
              print("Example: chore(app): add black-formatter and pre-commit\n")
              sys.exit(1)
          '
